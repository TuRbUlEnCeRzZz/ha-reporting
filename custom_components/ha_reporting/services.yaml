run_report:
  name: Run a report
  description: Starts the asynchronous HA Reporting pipeline and immediately returns the created job.
  fields:
    report_id:
      name: Report ID
      description: Internal HA Reporting report identifier.
      required: true
      example: rapport_domotique_mensuel
      selector:
        text:
    ai_analysis:
      name: AI analysis
      description: Force or disable AI analysis. Leave empty to follow the report configuration.
      required: false
      selector:
        boolean:
    generate_pdf:
      name: Generate PDF
      description: Generate and keep the native PDF at the end of the report.
      default: true
      required: false
      selector:
        boolean:
    theme:
      name: PDF theme
      description: Theme used for the native PDF.
      default: dark
      required: false
      selector:
        select:
          options:
            - dark
            - light
    destinations:
      name: Destinations
      description: Export destinations to run after PDF generation, for example paperless.
      required: false
      example:
        - paperless
      selector:
        select:
          multiple: true
          custom_value: true
          options:
            - paperless
